name: TensorWave Python tooling

on:
  push:
    branches:
      - main
      - 'model/**'
      - 'bench/**'
  pull_request:

jobs:
  safetensors-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check
        run: |
          python -m py_compile tools/safetensors_atlas.py
          python -m py_compile tools/pack_stream_tiles.py
          python -m py_compile tests/test_safetensors_tools.py

      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
