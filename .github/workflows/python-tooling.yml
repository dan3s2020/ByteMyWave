name: TensorWave Python tooling

on:
  push:
    branches:
      - main
      - 'model/**'
      - 'bench/**'
      - 'quant/**'
  pull_request:

concurrency:
  group: tensorwave-python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safetensors-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Phase-3 tooling dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Syntax check
        run: |
          python -m py_compile tools/safetensors_atlas.py
          python -m py_compile tools/pack_stream_tiles.py
          python -m py_compile tools/build_runtime_schedule.py
          python -m py_compile tools/quantize_q4_pack.py
          python -m py_compile tools/verify_q4_pack.py
          python -m py_compile tools/summarize_runs.py
          python -m py_compile tests/test_safetensors_tools.py
          python -m py_compile tests/test_runtime_schedule.py
          python -m py_compile tests/test_q4_quantization.py

      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
