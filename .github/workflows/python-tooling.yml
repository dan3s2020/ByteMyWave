name: TensorWave Python tooling

on:
  push:
    branches:
      - main
      - 'model/**'
      - 'bench/**'
      - 'quant/**'
      - 'research/**'
  pull_request:

concurrency:
  group: tensorwave-python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safetensors-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Phase-3 tooling dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Syntax check
        run: |
          python -m py_compile tools/safetensors_atlas.py
          python -m py_compile tools/pack_stream_tiles.py
          python -m py_compile tools/build_runtime_schedule.py
          python -m py_compile tools/quantize_q4_pack.py
          python -m py_compile tools/verify_q4_pack.py
          python -m py_compile tools/summarize_runs.py
          python -m py_compile tools/build_feasibility_map.py
          python -m py_compile tools/calibrate_feasibility_map.py
          python -m py_compile tools/build_measured_map.py
          python -m py_compile tools/aggregate_feasibility_runs.py
          python -m py_compile tests/test_safetensors_tools.py
          python -m py_compile tests/test_runtime_schedule.py
          python -m py_compile tests/test_q4_quantization.py
          python -m py_compile tests/test_feasibility_map.py
          python -m py_compile tests/test_feasibility_calibration.py

      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Generate analytical smoke map
        run: |
          python tools/build_feasibility_map.py \
            --output-dir build-map-smoke \
            --pcie-gbps 12 \
            --effective-tflops 10 \
            --bytes-per-param 0.625 \
            --models-b 7,13,33,70 \
            --m-values 1,16,64,256,512,1024
          test -s build-map-smoke/feasibility-map.json
          test -s build-map-smoke/feasibility-map.csv
          test -s build-map-smoke/FEASIBILITY-MAP.md
          test -s build-map-smoke/feasibility-map.svg
